<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>3D Model Designer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef1f7;--pn:#fff;--p2:#f1f4fa;--ink:#18202f;--ink2:#5b657b;--ln:#dbe1ed;--ac:#ff6a2b;--bl:#2f6df6;--gr:#14a56a;--rd:#e5484d;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--pn:#182032;--p2:#1f2940;--ink:#eaf0ff;--ink2:#9aa7c4;--ln:#2b3753}}
:root[data-theme=dark]{--bg:#0f1420;--pn:#182032;--p2:#1f2940;--ink:#eaf0ff;--ink2:#9aa7c4;--ln:#2b3753}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
h3{margin:0 0 4px;font-size:16px}p{margin:4px 0}
header{flex-wrap:wrap;display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
header b{white-space:nowrap}


main{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr) 270px;gap:10px;padding:10px}
.pnl{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
#V{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(var(--p2),var(--bg));border:1px solid var(--ln);min-height:0}
#c{width:100%;height:100%;display:block;touch-action:none}
.b{border:1px solid var(--ln);background:var(--pn);color:var(--ink);border-radius:9px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
.b:hover{border-color:var(--ac)}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}.b.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 15%,var(--pn))}.b:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.sub{color:var(--ink2);font-size:12.5px}
.f{display:grid;grid-template-columns:66px 1fr 68px;gap:6px;align-items:center;margin:4px 0}
input[type=number],select{width:100%;padding:5px;border:1px solid var(--ln);border-radius:7px;background:var(--pn);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.part{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;background:var(--p2);margin-bottom:4px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-weight:700;color:#fff}.g{background:var(--gr)}.r{background:var(--rd)}
.bar{height:10px;border-radius:9px;background:var(--p2);overflow:hidden;border:1px solid var(--ln)}.bar i{display:block;height:100%;width:0;background:var(--ac)}
.fc{text-align:left;width:100%;margin-bottom:5px}
.vt{position:absolute;top:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:70%}
.vt .b{padding:3px 8px;font-size:12px;background:color-mix(in srgb,var(--pn) 88%,transparent)}
#toast{position:absolute;left:10px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--pn) 90%,transparent);border:1px solid var(--ln);font-weight:700}
#toast{bottom:10px;opacity:0;transition:.3s;pointer-events:none}#toast.s{opacity:1}
.dim{position:absolute;display:flex;align-items:center;background:var(--pn);border:1.5px solid var(--ac);border-radius:8px;font-size:12px;font-weight:700;transform:translate(-50%,-50%);z-index:3;color:var(--ink)}.dim[hidden]{display:none}.dim i{padding:0 5px;color:var(--ac);font-style:normal}.dim input[type=number]{width:56px;border:0;padding:3px 2px;background:transparent;color:var(--ink);font:inherit;text-align:center}.dim input[type=checkbox]{margin:3px 2px 3px 6px}.dim span{padding-right:6px}
@media(max-width:900px){body{overflow:auto;height:auto}main{display:flex;flex-direction:column}#V{order:-1;flex:none;height:60vh}.pnl{overflow:visible}}
.logo{height:48px;width:48px;border-radius:50%;object-fit:cover;background:#fff;padding:0;flex:none;box-shadow:0 0 0 2px var(--ln)}
@media(max-width:700px){.logo{height:36px;width:36px}}
</style></head><body>

function deser(d){let o;if(d.k=='shape')o=norm(SHF[d.t]());else if(d.k=='group'){o=new T.Group();d.c.forEach(c=>o.add(deser(c)))}else{let ge=d.gi&&GEO.get(d.gi);if(!ge){ge=new T.BufferGeometry();ge.setAttribute('position',new T.Float32BufferAttribute(d.g,3));ge.computeVertexNormals()}o=new T.Mesh(ge,mat)}o.position.fromArray(d.p);o.quaternion.fromArray(d.q);o.scale.fromArray(d.s);o.userData={name:d.n,kind:d.k,type:d.t,base:new T.Vector3(...d.b),gid:d.gi};if(d.h)setHole(o,true);return o}

/* STL import */
const GEO=new Map();let gidN=0;
function parseSTL(buf){
 const len=buf.byteLength,dv=new DataView(buf);
 if(len>=84){const n=dv.getUint32(80,true),exact=84+n*50===len;
  const head=new TextDecoder().decode(new Uint8Array(buf,0,Math.min(len,256)));
  const looksText=/^\s*solid/i.test(head)&&/facet|vertex/i.test(head);
  if(exact||(!looksText&&n>0&&84+n*50<=len)){const out=new Float32Array(n*9);let o=84;for(let i=0;i<n;i++){o+=12;for(let k=0;k<9;k++){out[i*9+k]=dv.getFloat32(o,true);o+=4}o+=2}return out}}
 const txt=new TextDecoder().decode(buf),re=/vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g,a=[];let m;
 while((m=re.exec(txt)))a.push(+m[1],+m[2],+m[3]);
 a.length-=a.length%9;return Float32Array.from(a)}
function importSTL(buf,fname){
 let raw=null;try{raw=parseSTL(buf)}catch(e){console.error(e)}
 const nT=raw?raw.length/9:0;
 if(!nT)return toast('Could not read "'+fname+'". Is it a valid STL file?');
 if(nT>250000)return toast('"'+fname+'" has '+nT.toLocaleString()+' triangles. Please simplify it to under 250,000 first.');
 const P=new Float32Array(raw.length);let a=1e30,b=1e30,c=1e30,A=-1e30,B=-1e30,C=-1e30;
 for(let i=0;i<raw.length;i+=3){const X=isFinite(raw[i])?raw[i]:0,Y=isFinite(raw[i+1])?raw[i+1]:0,Z=isFinite(raw[i+2])?raw[i+2]:0;
  const x=X,y=Z,z=-Y;P[i]=x;P[i+1]=y;P[i+2]=z;if(x<a)a=x;if(x>A)A=x;if(y<b)b=y;if(y>B)B=y;if(z<c)c=z;if(z>C)C=z}
 const mx=Math.max(A-a,B-b,C-c);
 if(!(mx>0))return toast('"'+fname+'" looks empty.');
 let s=.1,note='';const cm=mx*.1;
 if(cm>18){s=18/mx;note=' It was '+cm.toFixed(0)+' cm wide, so it was scaled down to fit the bed.'}
 else if(cm<1){s=5/mx;note=' It was tiny, so it was scaled up to 5 cm.'}
 const cx=(a+A)/2,cz=(c+C)/2;
 for(let i=0;i<P.length;i+=3){P[i]=(P[i]-cx)*s;P[i+1]=(P[i+1]-b)*s;P[i+2]=(P[i+2]-cz)*s}
 const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));geo.computeVertexNormals();
 const id=++gidN;GEO.set(id,geo);
 const k=root.children.length,m=new T.Mesh(geo,mat);
 m.position.set(k?((k%3)-1)*5:0,0,k?Math.floor(k/3)*5-2:0);
 m.userData={name:mkName((fname.replace(/\.stl$/i,'').slice(0,24))||'Imported'),kind:'solid',gid:id};base(m);root.add(m);S.sel=[m];partsChanged();
 toast('Imported "'+fname+'" ('+nT.toLocaleString()+' triangles).'+note,note?5000:2800)}
async function importFiles(fs){
 for(const f of fs){
  if(!/\.stl$/i.test(f.name)){toast('"'+f.name+'" is not an .stl file');continue}
  try{importSTL(await f.arrayBuffer(),f.name)}catch(e){console.error(e);toast('Could not open "'+f.name+'"')}}}
$('#V').addEventListener('dragover',e=>e.preventDefault());
$('#V').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)importFiles([...e.dataTransfer.files])});
panel();resetHist();resize();camTo(.7,1.05,34,0,3,0);requestAnimationFrame(tick);
</script></body></html>
